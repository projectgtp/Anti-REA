# Anti-REA v1.0 - L99 iOS profile (same REA-IR)
#
# STATUS: defined, never built on iOS here. There is no iOS toolchain
# in this VM, no Xcode project, no Swift code, and no device test.
# This file is a DEFINITION: it maps every REA-IR layer (L01-L103) to
# its iOS equivalent so that, when an iOS build exists, the same REA-IR
# manifest, keys, blobs and server attestation can be reused.
#
# Verdicts (exactly three, no others):
#   APPLIES         - the layer transfers to iOS essentially unchanged
#                     (same technique, iOS-native API).
#   ADAPTED         - same protection goal, different mechanism
#                     (different file format, language, or API).
#   DOES-NOT-APPLY  - Android-only; no iOS counterpart. A reason is
#                     always given, and no mechanism is claimed.
#
# Fields per entry:
#   layer     - REA-IR layer id, must exist in layers/REGISTRY.md
#   verdict   - one of the three verdicts above
#   mechanism - REQUIRED for APPLIES and ADAPTED: the iOS mechanism
#   android   - short name of the Android mechanism (from the registry)
#   reason    - REQUIRED for DOES-NOT-APPLY: why there is no iOS form
#   note      - optional honest limit (only where a real one exists)
#
# Format: plain YAML subset, parseable with Python stdlib only
# (no PyYAML). Same subset as transformer/config.py: key: value
# lines, nested mappings by indentation, lists with "- " items,
# double-quoted scalars. No tabs, no flow maps, no anchors.
version: 1
